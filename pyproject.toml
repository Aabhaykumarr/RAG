readme = "README.md"
authors = [
    { name = "Aabhaykumarr", email = "aabhaykumarr9199@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
